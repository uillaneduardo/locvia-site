<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="theme-color" content="#f8f9fc">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Experimente o Locvia: acompanhe seus itens, aluguéis, retiradas e devoluções, com dados fictícios.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/demo/workflow.css">
  <link rel="stylesheet" href="/demo/personalization.css">

</head>
<body>
  <svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <symbol id="i-box" viewBox="0 0 24 24"><path d="m3 7 9-5 9 5v10l-9 5-9-5V7Z"/><path d="m3 7 9 5 9-5M12 12v10"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M17 15a5 5 0 0 1 4 5v1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>

    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></symbol>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><a href="/" aria-label="Voltar à página inicial do Locvia"><img src="/assets/favicon.svg" alt="" width="35" height="35"><strong>locvia<span>.</span></strong></a></div>
      <div class="workspace-label">MEU NEGÓCIO</div>
      <div class="workspace-card"><div class="workspace-symbol" id="workspace-symbol">FA</div><div class="workspace-info"><strong id="workspace-name">Festa Aurora</strong><small>Conta de demonstração</small></div></div>
      <nav class="nav" aria-label="Áreas do Locvia">
        <button type="button" class="nav-link active" data-view="hoje"><svg class="ico"><use href="#i-home"/></svg> Hoje</button>
        <button type="button" class="nav-link" data-view="alugueis"><svg class="ico"><use href="#i-calendar"/></svg> Aluguéis</button>
        <button type="button" class="nav-link" data-view="itens"><svg class="ico"><use href="#i-box"/></svg> Meus itens</button>
        <button type="button" class="nav-link" data-view="clientes"><svg class="ico"><use href="#i-users"/></svg> Clientes</button>
        
        <button type="button" class="nav-link" data-view="configuracoes"><svg class="ico"><use href="#i-settings"/></svg> Configurações</button>
      </nav>
      <div class="sidebar-foot">
        <div class="demo-notice"><span class="demo-beacon"></span><strong>Você está experimentando</strong><p>Os dados são fictícios. Nada é enviado ou salvo no servidor.</p></div>
        <a class="sidebar-help-link" href="/ajuda/"><svg class="ico" aria-hidden="true"><use href="#i-help-circle"/></svg> Central de Ajuda</a>
        <a class="back-link" href="/">← Voltar ao site</a>
        <div class="foot-credit">Desenvolvido por <a href="https://ulln.com.br" target="_blank" rel="noopener noreferrer">ulln ↗</a></div>
      </div>
    </aside>
    <button class="overlay" id="overlay" type="button" hidden aria-label="Fechar menu"></button>
    <div class="main">
      <header class="topbar">
        <div class="top-left"><button class="menu-toggle" id="menu-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu"><svg class="ico"><use href="#i-menu"/></svg></button><div class="breadcrumb"><span>Locvia</span><svg class="ico"><use href="#i-chevron"/></svg><strong id="crumb">Hoje</strong></div></div>
        <div class="top-right">
          <label class="sector-switch"><span>Testar com</span><select id="sector" aria-label="Tipo de negócio na demonstração"><option value="festas">Festas e decoração</option><option value="livros">Livros</option><option value="equipamentos">Equipamentos</option><option value="veiculos">Veículos</option></select><svg class="ico"><use href="#i-down"/></svg></label>
          <a class="help-trigger" href="/ajuda/" title="Central de Ajuda" aria-label="Abrir Central de Ajuda e perguntas frequentes"><svg class="ico" aria-hidden="true"><use href="#i-help-circle"/></svg></a>
          <span class="top-demo"><span class="demo-beacon"></span> Demo</span>
        </div>
      </header>
      <main class="content" id="screen" tabindex="-1"></main>
    </div>

  <div id="modal" class="modal-layer" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
