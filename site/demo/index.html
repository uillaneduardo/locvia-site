<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f6">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Explore uma demonstração interativa da plataforma Locvia com dados fictícios.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/demo/demo.css">
  <title>Demonstração — Locvia</title>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m3 7 9 5 9-5-9-5-9 5Z"/><path d="M3 7v10l9 5 9-5V7M12 12v10"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M17 5a3 3 0 0 1 0 6M17 15a5 5 0 0 1 4 5v1"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 9V5a2 2 0 0 1 2-2h12M15 15h6M17 15h1"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M2 6h13v11H2zM15 10h4l3 4v3h-7M6 17a2 2 0 1 0 4 0M17 17a2 2 0 1 0 4 0"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="m12 2 1.9 7.1L21 11l-7.1 1.9L12 20l-1.9-7.1L3 11l7.1-1.9L12 2Z"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10m-7 5h4"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="app-logo" href="/" aria-label="Locvia, voltar ao site"><img src="/assets/favicon.svg" width="35" height="35" alt=""><strong>locvia<span>.</span></strong></a>
        <div class="workspace">
          <div class="workspace-avatar">EA</div><div><strong>Espaço Aurora</strong><small>Ambiente de demonstração</small></div>
        </div>
      </div>
      <nav class="sidebar-nav" aria-label="Áreas da demonstração">
        <div class="side-caption">ESPAÇO DE TRABALHO</div>
        <button type="button" data-page="visao-geral" class="side-link active"><svg class="ico"><use href="#i-grid"/></svg> Visão geral</button>
        <button type="button" data-page="acervo" class="side-link"><svg class="ico"><use href="#i-box"/></svg> Acervo</button>
        <button type="button" data-page="locacoes" class="side-link"><svg class="ico"><use href="#i-calendar"/></svg> Locações</button>
        <button type="button" data-page="clientes" class="side-link"><svg class="ico"><use href="#i-users"/></svg> Clientes</button>
        <button type="button" data-page="financeiro" class="side-link"><svg class="ico"><use href="#i-wallet"/></svg> Financeiro</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="demo-clarity"><span class="demo-dot"></span><strong>Modo demonstração</strong><p>Os dados são fictícios e as alterações não são salvas.</p></div>
        <a href="/" class="back-site">← Voltar ao site</a>
        <div class="side-credit">Desenvolvido por <a href="https://ulln.com.br" target="_blank" rel="noopener noreferrer">ulln ↗</a></div>
      </div>
    </aside>
    <button class="mobile-overlay" id="mobile-overlay" type="button" aria-label="Fechar menu" hidden></button>
    <div class="main-area">
      <header class="app-topbar">
        <div class="top-left">
          <button type="button" class="menu-button icon-button" id="menu-button" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false"><svg class="ico"><use href="#i-menu"/></svg></button>
          <div class="breadcrumb"><span>Espaço Aurora</span><svg class="ico"><use href="#i-chevron"/></svg><strong id="current-section">Visão geral</strong></div>
        </div>
        <div class="top-right">
          <label class="global-search"><svg class="ico"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Buscar nesta tela..." aria-label="Buscar na área atual" autocomplete="off"></label>
          <span class="demo-label"><span class="demo-dot"></span> Demonstração</span>
          <div class="user-avatar" title="Conta demonstrativa">EA</div>
        </div>
      </header>
      <main class="app-content" id="app-content" tabindex="-1"></main>
    </div>
  </div>
  <div class="modal-backdrop" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/demo/demo.js" defer></script>
</body>
</html>
